name: Sync Molly Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'  # Check every 6 hours for new Molly releases

jobs:
  sync:
    name: Sync Molly
    runs-on: ubuntu-22.04


    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PUBLISH_PAT || secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        run: |
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          gpgconf --kill gpg-agent

      - name: Configure Git
        run: |
          git config user.name "lone-cloud"
          git config user.email "lonecloud604@pm.me"
          git config user.signingkey F99993FBD1212375
          git config commit.gpgsign true

      - name: Add Molly upstream remote
        run: |
          git remote add molly https://github.com/mollyim/mollyim-android.git || true
          git fetch molly --tags --force || true

      - name: Check for new Molly commits
        id: check_new_tag
        run: |
          molly_main=$(git rev-parse molly/main)
          our_parent=$(git rev-parse HEAD^)

          echo "Molly main: $molly_main"
          echo "Our parent: $our_parent"

          if [ "$molly_main" != "$our_parent" ]; then
            echo "has_new_tag=true" >> $GITHUB_OUTPUT
          else
            echo "has_new_tag=false" >> $GITHUB_OUTPUT
          fi

      - name: Apply Polly customizations onto updated Molly main
        if: steps.check_new_tag.outputs.has_new_tag == 'true'
        run: |
          # Save our Polly-specific customization files before we reset
          mkdir -p /tmp/polly-overlay/.github/workflows
          mkdir -p /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/components/settings/app
          mkdir -p /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/megaphone
          mkdir -p /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/components
          mkdir -p /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/components/settings/app/notifications
          mkdir -p /tmp/polly-overlay/reproducible-builds/ci
          cp .github/workflows/*.yml /tmp/polly-overlay/.github/workflows/
          cp .github/FUNDING.yml /tmp/polly-overlay/FUNDING.yml
          cp app/build.gradle.kts /tmp/polly-overlay/app-build.gradle.kts
          cp app/gradle.properties /tmp/polly-overlay/app-gradle.properties
          cp README.md /tmp/polly-overlay/README.md
          cp reproducible-builds/ci/mini.env /tmp/polly-overlay/reproducible-builds/ci/mini.env
          cp app/src/main/java/org/thoughtcrime/securesms/components/settings/app/AppSettingsFragment.kt /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/components/settings/app/AppSettingsFragment.kt
          cp app/src/main/java/org/thoughtcrime/securesms/components/settings/app/notifications/NotificationsSettingsFragment.kt /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/components/settings/app/notifications/NotificationsSettingsFragment.kt
          cp app/src/main/java/org/thoughtcrime/securesms/megaphone/Megaphones.java /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/megaphone/Megaphones.java
          cp app/src/main/java/org/thoughtcrime/securesms/components/KeyboardAwareLinearLayout.java /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/components/KeyboardAwareLinearLayout.java

          # Reset to Molly's latest — we now have ALL of their new code
          git reset --hard molly/main

          # Remove all Molly's workflow files so only ours are present
          rm -f .github/workflows/*.yml

          # Re-overlay whole-file Polly customizations
          cp /tmp/polly-overlay/.github/workflows/*.yml .github/workflows/
          cp /tmp/polly-overlay/FUNDING.yml .github/FUNDING.yml
          cp /tmp/polly-overlay/app-build.gradle.kts app/build.gradle.kts
          cp /tmp/polly-overlay/app-gradle.properties app/gradle.properties
          cp /tmp/polly-overlay/README.md README.md
          cp /tmp/polly-overlay/reproducible-builds/ci/mini.env reproducible-builds/ci/mini.env
          cp /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/components/settings/app/AppSettingsFragment.kt app/src/main/java/org/thoughtcrime/securesms/components/settings/app/AppSettingsFragment.kt
          cp /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/components/settings/app/notifications/NotificationsSettingsFragment.kt app/src/main/java/org/thoughtcrime/securesms/components/settings/app/notifications/NotificationsSettingsFragment.kt
          cp /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/megaphone/Megaphones.java app/src/main/java/org/thoughtcrime/securesms/megaphone/Megaphones.java
          cp /tmp/polly-overlay/app/src/main/java/org/thoughtcrime/securesms/components/KeyboardAwareLinearLayout.java app/src/main/java/org/thoughtcrime/securesms/components/KeyboardAwareLinearLayout.java

          # Patch libs.versions.toml: raise minSdk to 31 (Molly may bump dep versions — don't stomp whole file)
          sed -i 's/^minSdk = "[0-9]*".*/minSdk = "34"               # POLLY: Raise min SDK to Android 14/' gradle/libs.versions.toml

          # Patch settings.gradle.kts: inject Polly maven repos if not already present
          if ! grep -q "argon2" settings.gradle.kts; then
            perl -0777 -i -pe \
              's|(includeModule\("im\.molly", "libsignal-android"\)\n\s*\}\n\s*\})|$1\n    maven {\n      url = uri("https://raw.githubusercontent.com/mollyim/maven/master/argon2/releases/")\n      content {\n        includeModule("im.molly", "argon2")\n      }\n    }\n    maven {\n      url = uri("https://raw.githubusercontent.com/mollyim/maven/master/native-utils/releases/")\n      content {\n        includeModule("im.molly", "native-utils")\n      }\n    }|' \
              settings.gradle.kts
          fi

          # Re-apply Polly branding to string values (Molly→Polly in display text only)
          find app/src/main/res -name "strings.xml" -o -name "strings2.xml" | xargs sed -i 's/\bMolly\b/Polly/g'

          # Commit all changes as a single Polly customization commit on top of new Molly
          git add -A
          git diff --cached --quiet || git commit -S -m "Polly: fork customizations on top of Molly $(git rev-parse --short molly/main)"

          # Force push since we rewrote history
          git push --force-with-lease origin HEAD:main
